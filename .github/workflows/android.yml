name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Ripristina google-services.json dal secret se configurato su GitHub,
    # altrimenti usa il template mock per validare la compilazione
    - name: Restore Firebase Configuration
      env:
        FIREBASE_CONFIG_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -n "$FIREBASE_CONFIG_BASE64" ]; then
          echo "Restoring google-services.json from repository secret..."
          echo "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
        else
          echo "Warning: GOOGLE_SERVICES_JSON_BASE64 secret not found. Using template for compilation check..."
          cp app/google-services.json.example app/google-services.json
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
